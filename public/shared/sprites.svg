<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    FLOCK TOGETHER — authored sprite sheet.
    One stroke language throughout: hedgerow ink at 5 units, round caps and
    joins, no gradients, no filters. Every symbol is flat farm hardware.

    Fills are deliberately left to CSS where a symbol carries state:
      .fleece  — the sheep's wool; set --fleece on any ancestor to colour it
      .raddle  — the marking dye blotch; set `color` on the <svg> to drive it
      .ink     — hedgerow-dark structure

    Hats are twenty interchangeable symbols, `sp-hat-<id>` for every id in
    shared/look.js. Every one is authored in a 60x60 box whose BOTTOM CENTRE
    (30,60) is the point that lands on the sheep's crown, so a hat is swapped
    by id alone with no per-hat positioning — see HAT_BOX in look.js. A hat is
    a prop, not identity: each carries its own object colours and none of them
    inherit the player's fleece.
  -->

  <!-- Sheep, side view. Twelve-scallop fleece so it reads as wool at any size.
       The raddle blotch is a separate path: unmarked until the answer lands. -->
  <symbol id="sp-sheep" viewBox="0 0 132 104">
    <g stroke="var(--hedge)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <!-- back legs then front legs, drawn under the fleece -->
      <path class="ink" d="M38 70v22M52 70v22M84 70v20M96 70v20" fill="none" stroke-width="9"/>
      <!-- fleece: scalloped closed path around an ellipse (cx60 cy52 rx42 ry26).
           The fill is the player's chosen colour, carried down as --fleece from
           whatever wraps the sheep. The fallback is the old enamel, so a sheep
           nobody has chosen for renders exactly as it always did. -->
      <path class="fleece" fill="var(--fleece, var(--enamel))"
        d="M18 52
           A12 12 0 0 1 23.6 39
           A12 12 0 0 1 39 29.5
           A12 12 0 0 1 60 26
           A12 12 0 0 1 81 29.5
           A12 12 0 0 1 96.4 39
           A12 12 0 0 1 102 52
           A12 12 0 0 1 96.4 65
           A12 12 0 0 1 81 74.5
           A12 12 0 0 1 60 78
           A12 12 0 0 1 39 74.5
           A12 12 0 0 1 23.6 65
           A12 12 0 0 1 18 52 Z"/>
      <!-- raddle: an irregular spray blotch on the flank -->
      <path class="raddle" fill="currentColor" stroke="none"
        d="M44 42c7-5 16-4 20 2s2 14-5 16-16 0-18-6 0-9 3-12Z"/>
      <!-- head and ear -->
      <path class="ink" d="M100 46c8-6 20-4 24 4s-2 18-11 19-16-4-17-11 0-9 4-12Z"/>
      <path class="ink" d="M104 42c-4-6-1-12 5-12s8 6 5 11" fill="none"/>
      <!-- Face. The ink marks are the face; the enamel discs beneath them are
           not decoration. The head is a dark .ink silhouette on the TV and an
           enamel one on the phone, so ink alone would vanish on one of the two
           surfaces. Layered, the eye reads as a light disc with a dark pupil on
           a dark head and as a plain ink dot on a light one. Solid fills only:
           a ring would close up at paddock size. -->
      <ellipse cx="113" cy="60.5" rx="7" ry="5" fill="var(--enamel)" stroke="none"/>
      <circle cx="107.5" cy="49" r="4.5" fill="var(--enamel)" stroke="none"/>
      <circle cx="116.5" cy="50" r="4.5" fill="var(--enamel)" stroke="none"/>
      <circle cx="107.5" cy="49" r="2.8" fill="var(--hedge)" stroke="none"/>
      <circle cx="116.5" cy="50" r="2.8" fill="var(--hedge)" stroke="none"/>
      <path d="M110 59.5q3 2.8 6 0" fill="none"/>
    </g>
  </symbol>

  <!-- Five-bar field gate. The timer: this swings shut across the paddock. -->
  <symbol id="sp-gate" viewBox="0 0 168 104">
    <g fill="none" stroke="var(--steel)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 14h156M6 34h156M6 54h156M6 74h156M6 92h156"/>
      <path d="M8 8v88M160 8v88"/>
      <path d="M10 92 160 12"/>
    </g>
  </symbol>

  <!-- Prize rosette, pinned on the winning paddock. Agricultural show, first place. -->
  <symbol id="sp-rosette" viewBox="0 0 104 132">
    <g stroke="var(--hedge)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <!-- ribbon tails -->
      <path fill="currentColor" d="M36 84 26 128l16-10 12 12 4-46Z"/>
      <path fill="currentColor" d="M68 84 82 126l-16-8-12 12-4-46Z"/>
      <!-- pleated ring: twelve petals -->
      <path fill="currentColor"
        d="M52 8
           A11 11 0 0 1 65 12
           A11 11 0 0 1 78 20
           A11 11 0 0 1 88 32
           A11 11 0 0 1 90 46
           A11 11 0 0 1 84 59
           A11 11 0 0 1 72 68
           A11 11 0 0 1 52 72
           A11 11 0 0 1 32 68
           A11 11 0 0 1 20 59
           A11 11 0 0 1 14 46
           A11 11 0 0 1 16 32
           A11 11 0 0 1 26 20
           A11 11 0 0 1 39 12
           A11 11 0 0 1 52 8 Z"/>
      <circle cx="52" cy="40" r="17" fill="var(--enamel)"/>
    </g>
  </symbol>

  <!-- Sheepdog, crouched at the outrun. Covers the clustering wait. -->
  <symbol id="sp-dog" viewBox="0 0 140 96">
    <g stroke="var(--hedge)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path class="ink" d="M28 60v26M46 62v24M92 60v26M108 58v28" fill="none" stroke-width="8"/>
      <path class="ink" d="M24 44c10-14 34-18 56-16s34 6 40 14c6 8 4 18-6 20-16 4-70 6-86 0-10-4-12-12-4-18Z"/>
      <path fill="var(--enamel)" d="M52 50c8-2 20-2 26 2s-2 12-12 12-20-2-22-8 2-5 8-6Z"/>
      <path class="ink" d="M116 34c8-4 18 0 20 8s-6 16-14 15-12-8-10-15 2-7 4-8Z"/>
      <path class="ink" d="M118 30c-3-8 2-14 8-12s6 8 3 12" fill="none"/>
      <path class="ink" d="M22 46C10 40 4 30 8 22" fill="none" stroke-width="8"/>
    </g>
  </symbol>

  <!-- Stake sign: carries a paddock's group label, driven into the field. -->
  <symbol id="sp-stake" viewBox="0 0 120 104">
    <g stroke="var(--hedge)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path class="ink" d="M58 62v40" fill="none" stroke-width="9"/>
      <rect x="8" y="8" width="104" height="54" rx="4" fill="var(--enamel)"/>
    </g>
  </symbol>

  <!-- Ear tag: the player's own identity on the phone. -->
  <symbol id="sp-eartag" viewBox="0 0 104 88">
    <g stroke="var(--hedge)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path fill="currentColor" d="M14 14h76a8 8 0 0 1 8 8v44a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8V22a8 8 0 0 1 8-8Z"/>
      <circle cx="24" cy="44" r="6" fill="var(--enamel)"/>
    </g>
  </symbol>

  <!-- Five-bar tally, as kept on a livestock record sheet. -->
  <symbol id="sp-tally" viewBox="0 0 60 48">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <path d="M10 8v32M22 8v32M34 8v32M46 8v32M6 40 50 8"/>
    </g>
  </symbol>
</svg>
